<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WealthOS</title>
<style>
:root{
  --red:#D71921;
  --mono:ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:2px;
}
html[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#131313; --surface2:#1B1B1B; --line:#272727;
  --txt:#F2F2F2; --mute:#7E7E7E; --silver:#B9BDC1; --glow:rgba(215,25,33,.30);
}
html[data-theme="light"]{
  --bg:#EFEFEF; --surface:#FFFFFF; --surface2:#F5F5F5; --line:#DCDCDC;
  --txt:#0E0E0E; --mute:#7A7A7A; --silver:#5C6167; --glow:rgba(215,25,33,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;padding-bottom:96px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt)}
button{cursor:pointer;background:none;border:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{font-family:var(--mono);font-size:16px;letter-spacing:.30em;font-weight:600}
.brand i{font-style:normal;color:var(--red)}
.hright{display:flex;align-items:center;gap:14px}
.fx{display:flex;align-items:baseline;gap:6px}
.icbtn{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--silver)}
.icbtn:hover{border-color:var(--red);color:var(--red)}
nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{padding:12px 16px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid transparent;white-space:nowrap}
nav button.on{color:var(--txt);border-bottom-color:var(--red)}

/* ---------- cards / grid ---------- */
.grid{display:grid;gap:10px;margin-top:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:1.6fr 1fr}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
.card h3{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:400;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.big{font-size:26px;font-weight:500;margin-top:6px}
.big small{font-size:10px;color:var(--mute);margin-left:5px;letter-spacing:.1em}
.hero{font-size:34px;font-weight:600;text-shadow:0 0 26px var(--glow)}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block;background:var(--red)}
.sub{font-size:11px;color:var(--mute);margin-top:8px}
.pos{color:#3BAE6B}.neg{color:var(--red)}
.strip{height:2px;background:var(--line);margin:14px -16px 0;position:relative;overflow:hidden}
.strip i{position:absolute;inset:0 auto 0 0;background:var(--red)}

/* ---------- tables / rows ---------- */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .t1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:10.5px;color:var(--mute);margin-top:3px;font-family:var(--mono);letter-spacing:.06em}
.tag{width:3px;height:26px;border-radius:1px;background:var(--silver);flex:none}
.amt{font-size:13.5px;white-space:nowrap}
.mini{font-size:10px;color:var(--mute);border:1px solid var(--line);padding:2px 6px;border-radius:2px;font-family:var(--mono);letter-spacing:.1em}
.empty{color:var(--mute);font-size:12px;text-align:center;padding:28px 0;font-family:var(--mono);letter-spacing:.1em}

/* ---------- controls ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
.btn{background:var(--red);color:#fff;padding:11px 18px;border-radius:var(--r);font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:8px 12px;width:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.seg button{flex:1;padding:10px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.seg button.on{background:var(--red);color:#fff}
.frow{display:flex;gap:10px}.frow>*{flex:1}

/* ---------- fab / modal ---------- */
.fab{position:fixed;right:20px;bottom:24px;width:54px;height:54px;border-radius:50%;background:var(--red);color:#fff;font-size:26px;display:grid;place-items:center;z-index:50;box-shadow:0 0 30px var(--glow)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:4px;border-bottom:1px solid var(--line)}}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.shead h2{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.x{font-size:20px;color:var(--mute);line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:2px;padding:6px 10px;margin:0 6px 6px 0;font-size:12px}
.chip button{color:var(--mute);font-size:14px;line-height:1}
svg{display:block}
.note{font-size:11px;color:var(--mute);line-height:1.6}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WealthOS">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<header>
  <div class="wrap">
    <div class="hbar">
      <div class="brand">WEALTH<i>OS</i></div>
      <div class="hright">
        <button class="icbtn" id="themeBtn">◐</button>
        <button class="icbtn" id="cfgBtn" title="Configuración">⚙</button>
      </div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<div class="wrap"><div id="view"></div></div>
<button class="fab" id="fab">+</button>

<div class="modal" id="modal"><div class="sheet">
  <div class="shead"><h2 id="mTitle"></h2><button class="x" onclick="closeModal()">✕</button></div>
  <div id="mBody"></div>
</div></div>

<script>
/* ============ almacenamiento (artifact / navegador / memoria) ============ */
const KEY='wealthos_v1';
const DB={
  async load(){
    try{ if(window.storage){const r=await window.storage.get(KEY); return r?JSON.parse(r.value):null;} }catch(e){}
    try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){}
    return null;
  },
  async save(s){
    const v=JSON.stringify(s);
    try{ if(window.storage){await window.storage.set(KEY,v); return;} }catch(e){}
    try{ localStorage.setItem(KEY,v); }catch(e){}
  }
};
const uid=()=>Math.random().toString(36).slice(2,10);

/* ============ estado inicial ============ */
function seed(){
  const cat=(n,t,subs)=>({id:uid(),name:n,type:t,subs:subs});
  return {
    settings:{theme:'dark',fx:18.65,fxAuto:true,fxDate:null,band:5,planAhead:0,lastBackup:null,
      goalCapital:8000000,goalPasiva:5000000,goalTrading:1000000,goalReserva:2000000,goalRetiro:18000,
      tax:{mode:'pct',pct:28,brackets:[],cur:'USD'}},
    members:[{id:uid(),name:'Jorge'},{id:uid(),name:'Pamela'},{id:uid(),name:'Valentina'},{id:uid(),name:'Familia'}],
    accounts:[],
    goals:[],
    tx:[],
    tAccounts:[],
    trades:[],
    tFlows:[],
    pAssets:[],
    pMoves:[],
    taxRes:[],
    categories:[
      cat('Vivienda','gasto',['Renta / Hipoteca','Luz','Agua','Gas','Internet','Mantenimiento','Predial']),
      cat('Alimentos','gasto',['Súper','Restaurantes','Café','Delivery']),
      cat('Transporte','gasto',['Gasolina','Mantenimiento','Seguro auto','Tenencia / Verificación','Casetas','Estacionamiento']),
      cat('Salud','gasto',['Consultas','Medicamentos','Seguro médico','Dentista','Óptica']),
      cat('Educación','gasto',['Colegiatura','Útiles / Uniformes','Cursos','Libros']),
      cat('Personal','gasto',['Ropa','Cuidado personal','Gimnasio']),
      cat('Entretenimiento','gasto',['Streaming','Salidas','Viajes','Hobbies']),
      cat('Financiero','gasto',['Comisiones','Intereses','Impuestos']),
      cat('Hijos','gasto',['Guardería','Actividades','Juguetes','Consumibles']),
      cat('Mascotas','gasto',['Alimento','Veterinario']),
      cat('Regalos y eventos','gasto',[]),
      cat('Otros','gasto',[]),
      cat('Nómina','ingreso',[]),
      cat('Aguinaldo / PTU','ingreso',[]),
      cat('Comisiones','ingreso',[]),
      cat('Retiro de trading','ingreso',[]),
      cat('Venta de activos','ingreso',[]),
      cat('Reembolsos','ingreso',[]),
      cat('Otros ingresos','ingreso',[])
    ]
  };
}
let S=seed(), tab='dash';

/* ============ utilidades ============ */
const mxn=n=>new Intl.NumberFormat('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const money=(n,c)=>(n<0?'-':'')+'$'+mxn(Math.abs(n))+' '+(c||'USD');
const usd=n=>n/(S.settings.fx||1);
const toMXN=(n,c)=>c==='USD'?n*(S.settings.fx||1):n;
let netCur='USD';
const cv=n=>netCur==='USD'?n/(S.settings.fx||1):n;
const acc=id=>S.accounts.find(a=>a.id===id);
const cat=id=>S.categories.find(c=>c.id===id);
const mem=id=>S.members.find(m=>m.id===id);
const today=()=>{const d=new Date();
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
const ymd=d=>d.slice(0,7);
const monthName=k=>{const[y,m]=k.split('-');return new Date(y,m-1,1).toLocaleDateString('es-MX',{month:'short',year:'2-digit'}).replace('.','')};

function balance(id){
  const a=acc(id); if(!a) return 0;
  let b=+a.initial||0;
  S.tx.forEach(t=>{
    if(t.type==='ingreso'&&t.accountId===id) b+=t.amount;
    if(t.type==='gasto'&&t.accountId===id) b-=t.amount;
    if(t.type==='transferencia'){ if(t.accountId===id) b-=t.amount; if(t.toAccountId===id) b+=t.amount; }
  });
  return b;
}
const taxSaved=y=>(S.taxRes||[]).filter(r=>!y||r.year===y)
  .reduce((z,r)=>z+(r.type==='pago'?-toMXN(r.amount,r.currency):toMXN(r.amount,r.currency)),0);
const taxSavedAll=()=>taxSaved(null);
const reserved=()=>S.goals.filter(g=>g.status!=='hecha').reduce((s,g)=>s+saved(g.id),0);
const saved=gid=>S.tx.filter(t=>t.type==='apartado'&&t.goalId===gid).reduce((s,t)=>s+toMXN(t.amount,t.currency),0);
function totals(){
  let liquido=0,tarjetas=0,prestamos=0,inver=0;
  S.accounts.forEach(a=>{const b=toMXN(balance(a.id),a.currency);
    if(a.type==='credito') tarjetas+=Math.min(b,0); else if(a.type==='prestamo') prestamos+=Math.min(b,0); else if(a.type==='inversion') inver+=b; else liquido+=b;});
  const deuda=tarjetas+prestamos;
  try{ inver+=pTotal(); }catch(e){}
  try{ (S.tAccounts||[]).filter(a=>a.mode==='real').forEach(a=>inver+=toMXN(tCapital(a.id),a.currency)); }catch(e){}
  return {liquido,deuda,tarjetas,prestamos,inver,neto:liquido+inver+deuda,disponible:liquido-reserved()-taxSavedAll()};
}
function monthStats(k){
  let ing=0,gas=0;
  S.tx.filter(t=>ymd(t.date)===k).forEach(t=>{
    if(t.type==='ingreso') ing+=toMXN(t.amount,t.currency);
    if(t.type==='gasto') gas+=toMXN(t.amount,t.currency);});
  return {ing,gas,bal:ing-gas};
}
function lastMonths(n){const out=[],d=new Date();d.setDate(1);
  for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.toISOString().slice(0,7));}return out;}

/* ============ render ============ */
const TABS=[['dash','Dashboard'],['tx','Movimientos'],['acc','Cuentas'],['inv','Inversión'],['tax','Impuestos'],['goal','Metas']];
function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  const cb=document.getElementById('cfgBtn');
  if(cb) cb.style.cssText=tab==='cfg'?'border-color:var(--red);color:var(--red)':'';
}
function go(k){tab=k;render();window.scrollTo(0,0);}
function render(){
  try{
    renderNav();
    const fn=({dash:vDash,tx:vTx,acc:vAcc,inv:vInv,tax:vTax,goal:vGoal,cfg:vCfg})[tab]||vDash;
    document.getElementById('view').innerHTML=fn();
  }catch(err){ showErr(err); }
}
function showErr(err){
  const m=(err&&(err.stack||err.message))||String(err);
  document.getElementById('view').innerHTML=`<div class="card" style="margin-top:14px">
    <h3>Ocurrió un error</h3>
    <div class="note" style="white-space:pre-wrap;font-family:var(--mono);font-size:11px">${String(m).replace(/</g,'&lt;')}</div>
    <button class="btn ghost" style="margin-top:12px" onclick="go('dash')">Volver al dashboard</button>
    <button class="btn ghost" style="margin-top:8px" onclick="exportJSON()">Exportar respaldo</button></div>`;
  console.error(err);
}
window.addEventListener('error',e=>showErr(e.error||e.message));
window.addEventListener('unhandledrejection',e=>showErr(e.reason));

/* ---- dashboard ---- */
function vDash(){
  const k=today().slice(0,7), m=monthStats(k), t=totals(), prev=monthStats(lastMonths(2)[0]);
  const d=(a,b)=>b?((a-b)/Math.abs(b)*100):0;
  const kpi=(t1,v,d1,inv)=>`<div class="card"><h3>${t1}<span class="dot"></span></h3>
    <div class="num big">$${mxn(usd(v))}<small>USD</small></div>
    <div class="sub">${d1===null?'Saldo actual':`<span class="num ${(inv?-d1:d1)>=0?'pos':'neg'}">${d1>=0?'▲':'▼'} ${Math.abs(d1).toFixed(1)}%</span> vs. mes anterior`}</div></div>`;

  const donut=(()=>{
    const by={};S.tx.filter(t2=>t2.type==='gasto'&&ymd(t2.date)===k).forEach(t2=>{const c=cat(t2.categoryId);const n=c?c.name:'Sin categoría';by[n]=(by[n]||0)+toMXN(t2.amount,t2.currency);});
    const e=Object.entries(by).sort((a,b)=>b[1]-a[1]);const tot=e.reduce((s,x)=>s+x[1],0);
    if(!tot) return '<div class="empty">Sin gastos este mes</div>';
    const sh=['#D71921','#8E1015','#B9BDC1','#5C6167','#2E2E2E','#E8595F','#7E7E7E'];
    let off=0,segs='';const C=2*Math.PI*54;
    e.forEach(([n,v],i)=>{const len=v/tot*C;segs+=`<circle cx="70" cy="70" r="54" fill="none" stroke="${sh[i%sh.length]}" stroke-width="16" stroke-dasharray="${len-1.5} ${C-len+1.5}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;});
    return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
      <svg width="140" height="140" viewBox="0 0 140 140">${segs}
        <text x="70" y="66" text-anchor="middle" fill="var(--mute)" font-size="8" font-family="monospace" letter-spacing="2">TOTAL</text>
        <text x="70" y="82" text-anchor="middle" fill="var(--txt)" font-size="13" font-family="monospace">$${mxn(usd(tot)).split('.')[0]}</text></svg>
      <div style="flex:1;min-width:170px">${e.map(([n,v],i)=>`<div class="row" style="padding:7px 0"><span class="dot" style="background:${sh[i%sh.length]}"></span><div class="grow t1">${n}</div><div class="num" style="font-size:12px">${(v/tot*100).toFixed(0)}%</div></div>`).join('')}</div></div>`;
  })();

  const bars=(()=>{
    const ms=lastMonths(6).map(x=>({k:x,...monthStats(x)}));
    const max=Math.max(1,...ms.map(x=>Math.max(x.ing,x.gas)));
    const W=100/6;
    return `<svg viewBox="0 0 300 120" style="width:100%;height:150px">
      ${[0,.5,1].map(f=>`<line x1="0" y1="${100-f*90}" x2="300" y2="${100-f*90}" stroke="var(--line)" stroke-width=".5"/>`).join('')}
      ${ms.map((x,i)=>{const bx=i*50+10;const h1=x.ing/max*90,h2=x.gas/max*90;return`
        <rect x="${bx}" y="${100-h1}" width="13" height="${h1}" fill="var(--silver)"/>
        <rect x="${bx+16}" y="${100-h2}" width="13" height="${h2}" fill="var(--red)"/>
        <text x="${bx+15}" y="113" text-anchor="middle" fill="var(--mute)" font-size="7" font-family="monospace">${monthName(x.k)}</text>`}).join('')}
    </svg>
    <div style="display:flex;gap:16px;margin-top:6px"><span class="lbl"><span class="dot" style="background:var(--silver)"></span> Ingresos</span><span class="lbl"><span class="dot"></span> Gastos</span></div>`;
  })();

  const recent=S.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,6);

  return `
  <div class="grid g4">
    ${kpi('Ingresos · mes',m.ing,d(m.ing,prev.ing))}
    ${kpi('Gastos · mes',m.gas,d(m.gas,prev.gas),1)}
    ${kpi('Balance · mes',m.bal,d(m.bal,prev.bal))}
    ${kpi('Disponible real',t.disponible,null)}
  </div>
  <div class="grid g3">
    <div class="card"><h3>Flujo de efectivo · 6 meses</h3>${bars}</div>
    <div class="card"><h3>Patrimonio
        <span>${['USD','MXN'].map(c=>`<button class="mini" style="${netCur===c?'border-color:var(--red);color:var(--red)':''}" onclick="netCur='${c}';render()">${c}</button>`).join(' ')}</span></h3>
      <div class="lbl">Neto</div><div class="num hero">$${mxn(cv(t.neto))}<small>${netCur}</small></div>
      ${netCur==='USD'?`<div class="sub">al tipo de cambio ${(+S.settings.fx).toFixed(2)}</div>`:''}
      <div style="margin-top:16px">
        <div class="row"><div class="grow t1">Líquido</div><div class="num amt">${money(cv(t.liquido),netCur)}</div></div>
        <div class="row"><div class="grow t1">Inversión</div><div class="num amt">${money(cv(t.inver),netCur)}</div></div>
        ${t.tarjetas?`<div class="row"><div class="grow t1">Deuda tarjetas</div><div class="num amt neg">${money(cv(t.tarjetas),netCur)}</div></div>`:''}
        ${t.prestamos?`<div class="row"><div class="grow t1">Préstamos</div><div class="num amt neg">${money(cv(t.prestamos),netCur)}</div></div>`:''}
        ${(t.tarjetas&&t.prestamos)?`<div class="row" style="border-top:1px solid var(--line)"><div class="grow t1"><b>Deuda total</b></div><div class="num amt neg"><b>${money(cv(t.deuda),netCur)}</b></div></div>`:''}
        ${(!t.tarjetas&&!t.prestamos)?`<div class="row"><div class="grow t1">Deuda</div><div class="num amt">${money(0,netCur)}</div></div>`:''}
        <div class="row"><div class="grow t1">Apartado en metas</div><div class="num amt">${money(cv(reserved()),netCur)}</div></div>
        <div class="row"><div class="grow t1">Reservado para impuestos</div><div class="num amt">${money(cv(taxSavedAll()),netCur)}</div></div>
      </div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Distribución de gastos · mes</h3>${donut}</div>
    ${(()=>{
      const act=S.goals.filter(g=>g.status!=='lograda'&&+g.target>0)
        .map(g=>{const ah=g.cur==='USD'?saved(g.id)/(S.settings.fx||1):saved(g.id);
          return {...g,ahorro:ah,pct:Math.min(100,ah/+g.target*100)};})
        .sort((a,b)=>b.pct-a.pct).slice(0,3);
      if(!act.length) return '';
      return `<div class="card" style="margin-top:10px"><h3>Metas más avanzadas<button class="mini" onclick="go('goal')">Ver todas</button></h3>
        ${act.map(g=>`<div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;align-items:baseline">

          <div class="strip" style="margin:6px 0 4px"><i style="width:${g.pct.toFixed(1)}%"></i></div>
          <div class="t2">$${mxn(g.ahorro)} de $${mxn(+g.target)} ${g.cur}</div></div>`).join('')}</div>`;})()}

    ${(()=>{
      const cred=S.accounts.filter(a=>a.type==='credito'||a.type==='prestamo');
      if(!cred.length) return '';
      const filas=cred.map(a=>{const b=balance(a.id), d=Math.max(0,-b);
        return {a,d,lim:+a.limit||Math.abs(+a.initial||0)};});
      const totalMXN=filas.reduce((z,f)=>z+toMXN(f.d,f.a.currency),0);
      return `<div class="card" style="margin-top:10px"><h3>Créditos y préstamos
        <span class="mini">${money(cv(totalMXN),netCur)}</span></h3>
        ${filas.map(({a,d,lim})=>{const use=lim?Math.min(100,d/lim*100):0;
          return `<div style="margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;align-items:baseline">
              <span class="t1">${a.name}</span>
              <span class="num amt ${d?'neg':'pos'}" style="font-size:12px">${d?'-':''}${money(d,a.currency)}</span></div>
            <div class="strip" style="margin:6px 0 4px"><i style="width:${use.toFixed(1)}%;background:${use>70?'var(--red)':'var(--silver)'}"></i></div>
            <div class="t2">${a.type==='credito'?`${use.toFixed(0)}% del límite · disponible ${money(Math.max(0,lim-d),a.currency)}`
              :`${(100-use).toFixed(0)}% liquidado${a.payment?` · pago ${money(a.payment,a.currency)}`:''}`}</div></div>`;}).join('')}
        <button class="btn ghost sm" onclick="go('acc')">Ver cuentas</button></div>`;})()}

    <div class="card" style="margin-top:10px"><h3>Actividad reciente<button class="mini" onclick="go('tx')">Ver todo</button></h3>
      ${recent.length?recent.map(txRow).join(''):'<div class="empty">Sin movimientos</div>'}</div>
  </div>
  <div class="card" style="margin-top:10px"><div class="note">Los datos viven solo en este dispositivo. Respalda desde <b>Configuración → Exportar</b>.${S.settings.lastBackup?` Último respaldo: ${S.settings.lastBackup}.`:' Aún no has respaldado.'}</div></div>`;
}

/* ---- movimientos ---- */
let filt={m:'',q:'',t:''};
function txRow(t){
  const a=acc(t.accountId),c=cat(t.categoryId),mm=mem(t.memberId);
  const sign=t.type==='ingreso'?'+':t.type==='gasto'?'-':'';
  const col=t.type==='ingreso'?'pos':t.type==='gasto'?'neg':'';
  const dest=t.type==='transferencia'?' → '+(acc(t.toAccountId)?.name||'?'):t.type==='apartado'?' → '+(S.goals.find(g=>g.id===t.goalId)?.name||'meta'):'';
  return `<div class="row" onclick="editTx('${t.id}')" style="cursor:pointer">
    <div class="tag" style="background:${t.type==='ingreso'?'#3BAE6B':t.type==='gasto'?'var(--red)':'var(--silver)'}"></div>
    <div class="grow"><div class="t1">${t.note||c?.name||t.type}${t.sub?' · '+t.sub:''}</div>
      <div class="t2">${t.date} · ${a?a.name:'—'}${dest}${mm?' · '+mm.name:''}</div></div>
    <div class="num amt ${col}">${sign}$${mxn(t.amount)} <span style="color:var(--mute);font-size:9px">${t.currency}</span></div></div>`;
}
function vTx(){
  const months=[...new Set(S.tx.map(t=>ymd(t.date)))].sort().reverse();
  let list=S.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  if(filt.m) list=list.filter(t=>ymd(t.date)===filt.m);
  if(filt.t) list=list.filter(t=>t.type===filt.t);
  if(filt.q){const q=filt.q.toLowerCase();list=list.filter(t=>((t.note||'')+(cat(t.categoryId)?.name||'')+(t.sub||'')+(mem(t.memberId)?.name||'')).toLowerCase().includes(q));}
  const sum=list.reduce((s,t)=>s+(t.type==='ingreso'?toMXN(t.amount,t.currency):t.type==='gasto'?-toMXN(t.amount,t.currency):0),0);
  return `<div class="card" style="margin-top:14px">
    <div class="frow" style="margin-bottom:10px">
      <select onchange="filt.m=this.value;render()"><option value="">Todos los meses</option>${months.map(m=>`<option ${filt.m===m?'selected':''}>${m}</option>`).join('')}</select>
      <select onchange="filt.t=this.value;render()"><option value="">Todo tipo</option>${['ingreso','gasto','transferencia','apartado'].map(x=>`<option ${filt.t===x?'selected':''}>${x}</option>`).join('')}</select>
    </div>
    <input placeholder="Buscar…" value="${filt.q}" oninput="filt.q=this.value;render()">
    <div style="display:flex;justify-content:space-between;margin:14px 0 4px"><span class="lbl">${list.length} movimientos</span><span class="num ${sum>=0?'pos':'neg'}">${money(usd(sum),'USD')}</span></div>
    ${list.length?list.map(txRow).join(''):'<div class="empty">Sin resultados</div>'}</div>`;
}

/* ---- cuentas ---- */
const TYPES={debito:'Débito',efectivo:'Efectivo',credito:'Crédito',inversion:'Inversión',prestamo:'Préstamo'};
function vAcc(){
  if(!S.accounts.length) return `<div class="card" style="margin-top:14px"><div class="empty">Aún no hay cuentas</div><button class="btn" onclick="editAcc()">Agregar cuenta</button></div>`;
  return `<div class="grid g2">${S.accounts.map(a=>{
    const b=balance(a.id);
    if(a.type==='credito'){
      const deuda=Math.max(0,-b), saldoFavor=Math.max(0,b);
      const lim=+a.limit||0, disp=lim-deuda+saldoFavor;
      const use=lim?Math.min(100,deuda/lim*100):0;
      return `<div class="card"><h3>${a.name}<button class="mini" onclick="editAcc('${a.id}')">Editar</button></h3>
        <div class="lbl">Crédito disponible · ${a.currency}</div>
        <div class="num big">${money(disp,a.currency)}</div>
        <div class="strip"><i style="width:${use.toFixed(1)}%"></i></div>
        <div style="display:flex;justify-content:space-between;margin-top:8px">
          <span class="num" style="font-size:11px;color:var(--mute)">${use.toFixed(0)}% utilizado</span>
          <span class="num" style="font-size:11px;color:var(--mute)">límite $${mxn(lim)}</span></div>
        <div style="margin-top:10px">
          <div class="row" style="padding:8px 0"><div class="grow t1">Deuda actual</div>
            <div class="num amt ${deuda?'neg':''}">${deuda?'-':''}$${mxn(deuda)}</div></div>
          <div class="row" style="padding:8px 0"><div class="grow t1">Corte / Pago</div>
            <div class="num amt" style="font-size:12px;color:var(--mute)">día ${a.cutDay||'—'} / día ${a.payDay||'—'}</div></div>
        </div></div>`;
    }
    if(a.type==='prestamo'){
      const deuda=Math.max(0,-b);
      const orig=Math.abs(+a.initial||0), pagado=Math.max(0,orig-deuda);
      const pct=orig?Math.min(100,pagado/orig*100):0;
      return `<div class="card"><h3>${a.name}<button class="mini" onclick="editAcc('${a.id}')">Editar</button></h3>
        <div class="lbl">Saldo pendiente · ${a.currency}</div>
        <div class="num big ${deuda?'neg':''}">${deuda?'-':''}${money(deuda,a.currency)}</div>
        <div class="strip"><i style="width:${pct.toFixed(1)}%"></i></div>
        <div style="display:flex;justify-content:space-between;margin-top:8px">
          <span class="num" style="font-size:11px;color:var(--mute)">${pct.toFixed(0)}% liquidado</span>
          <span class="num" style="font-size:11px;color:var(--mute)">original $${mxn(orig)}</span></div>
        <div style="margin-top:10px">
          <div class="row" style="padding:8px 0"><div class="grow t1">Pagado</div>
            <div class="num amt pos">$${mxn(pagado)}</div></div>
          ${a.rate?`<div class="row" style="padding:8px 0"><div class="grow t1">Tasa anual</div>
            <div class="num amt" style="font-size:12px;color:var(--mute)">${a.rate}%</div></div>`:''}
          ${a.payment?`<div class="row" style="padding:8px 0"><div class="grow t1">Pago mensual</div>
            <div class="num amt" style="font-size:12px;color:var(--mute)">$${mxn(a.payment)}${a.payDay?` · día ${a.payDay}`:''}</div></div>`:''}
        </div></div>`;
    }
    return `<div class="card"><h3>${a.name}<button class="mini" onclick="editAcc('${a.id}')">Editar</button></h3>
      <div class="lbl">${TYPES[a.type]} · ${a.currency}</div>
      <div class="num big ${b<0?'neg':''}">${money(b,a.currency)}</div>
      ${a.currency==='USD'?`<div class="sub">≈ $${mxn(toMXN(b,'USD'))} MXN</div>`:''}</div>`}).join('')}</div>
    <button class="btn ghost" style="margin-top:12px" onclick="editAcc()">+ Nueva cuenta</button>`;
}

/* ---- metas ---- */
function metaImpuestos(){return S.goals.find(g=>/impuest|tax|isr|sat/i.test(g.name||''));}
function migrarImpuestos(){
  const g=metaImpuestos(); if(!g) return;
  if(!Array.isArray(S.taxRes)) S.taxRes=[];
  const aps=S.tx.filter(t=>t.type==='apartado'&&t.goalId===g.id);
  aps.forEach(t=>S.taxRes.push({id:uid(),date:t.date,type:'reserva',
    amount:+t.amount,currency:t.currency||'MXN',year:t.date.slice(0,4),
    note:'Migrado desde metas'}));
  S.tx=S.tx.filter(t=>!(t.type==='apartado'&&t.goalId===g.id));
  S.goals=S.goals.filter(x=>x.id!==g.id);
  save();render();
  toast(aps.length?`${aps.length} apartado(s) movidos a la reserva fiscal.`:'Meta de impuestos eliminada.');
}
function vGoal(){
  const gi=metaImpuestos();
  const aviso=gi?`<div class="card" style="margin-top:14px">
    <h3>Meta de impuestos detectada<span class="dot"></span></h3>
    <div class="note" style="margin-bottom:14px">La meta «${gi.name}» viene de una versión anterior. Los impuestos ahora viven en su propia pestaña y no deben ocupar un lugar entre tus metas familiares. Puedo mover sus apartados a la reserva fiscal y eliminar la meta.</div>
    <button class="btn" onclick="migrarImpuestos()">Mover a reserva fiscal</button></div>`:'';
  return aviso+`${S.goals.length?`<div class="grid g2">${S.goals.map(g=>{
    const s=(g.cur==='USD')?saved(g.id)/(S.settings.fx||1):saved(g.id), p=Math.min(100,g.target?s/g.target*100:0);
    return `<div class="card"><h3>${g.name}<button class="mini" onclick="editGoal('${g.id}')">Editar</button></h3>
      <div class="lbl">${mem(g.memberId)?.name||'Familia'}${g.status==='hecha'?' · Completada':''}</div>
      <div class="num big">$${mxn(s)}<small>de $${mxn(g.target)} ${g.cur||'USD'}</small></div>
      <div class="strip"><i style="width:${p.toFixed(1)}%"></i></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px">
        <span class="num" style="font-size:11px">${p.toFixed(0)}%</span>
        <button class="mini" onclick="apartar('${g.id}')">+ Apartar</button></div></div>`}).join('')}</div>`
    :'<div class="card" style="margin-top:14px"><div class="empty">Aún no hay metas</div></div>'}
    <button class="btn ghost" style="margin-top:12px" onclick="editGoal()">+ Nueva meta</button>`;
}

/* ============ modales ============ */
const M=document.getElementById('modal');
function openModal(t,h){document.getElementById('mTitle').textContent=t;document.getElementById('mBody').innerHTML=h;M.classList.add('on');}
function closeModal(){M.classList.remove('on');}
M.onclick=e=>{if(e.target===M)closeModal();};

/* -- movimiento -- */
let FRM={};
document.getElementById('fab').onclick=()=>{
  if(tab==='inv'&&invMode==='activa'&&S.tAccounts.length){ invTab==='dep'?editFlow():editTrade(); }
  else if(tab==='inv'&&invMode==='pasiva'&&S.pAssets.length){ editPMove(); }
  else if(tab==='tax'){ editTaxRes(null,0); }
  else if(tab!=='cfg') editTx();
};
function editTx(id){
  const t=S.tx.find(x=>x.id===id);
  FRM=t?{...t}:{id:null,type:'gasto',date:today(),amount:'',currency:'USD',accountId:S.accounts[0]?.id||'',toAccountId:'',categoryId:'',sub:'',memberId:S.members[0]?.id||'',note:'',goalId:''};
  drawTx();
}
function drawTx(){
  const f=FRM, cats=S.categories.filter(c=>c.type===(f.type==='ingreso'?'ingreso':'gasto'));
  const c=cat(f.categoryId);
  const opts=(arr,v,lbl)=>arr.map(x=>`<option value="${x.id}" ${v===x.id?'selected':''}>${lbl(x)}</option>`).join('');
  openModal(f.id?'Editar movimiento':'Nuevo movimiento',`
    <div class="seg">${['gasto','ingreso','transferencia','apartado'].map(x=>`<button class="${f.type===x?'on':''}" onclick="FRM.type='${x}';FRM.categoryId='';FRM.sub='';drawTx()">${x}</button>`).join('')}</div>
    <div class="frow"><div class="field"><label>Monto</label><input type="number" step="0.01" inputmode="decimal" value="${f.amount}" oninput="FRM.amount=this.value"></div>
      <div class="field"><label>Moneda</label><select onchange="FRM.currency=this.value">${['USD','MXN'].map(x=>`<option ${f.currency===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
    <div class="field"><label>Fecha</label><input type="date" value="${f.date}" onchange="FRM.date=this.value"></div>
    <div class="field"><label>${f.type==='transferencia'?'Cuenta origen':'Cuenta'}</label>
      <select onchange="FRM.accountId=this.value">${opts(S.accounts,f.accountId,a=>a.name+' · '+TYPES[a.type])}</select></div>
    ${f.type==='transferencia'?`<div class="field"><label>Cuenta destino</label>
      <select onchange="FRM.toAccountId=this.value"><option value="">—</option>${opts(S.accounts,f.toAccountId,a=>a.name)}</select></div>`:''}
    ${f.type==='apartado'?`<div class="field"><label>Meta</label>
      <select onchange="FRM.goalId=this.value"><option value="">—</option>${opts(S.goals,f.goalId,g=>g.name)}</select></div>`:''}
    ${(f.type==='gasto'||f.type==='ingreso')?`
      <div class="field"><label>Categoría</label><select onchange="FRM.categoryId=this.value;FRM.sub='';drawTx()">
        <option value="">—</option>${opts(cats,f.categoryId,x=>x.name)}</select></div>
      ${c&&c.subs.length?`<div class="field"><label>Subcategoría</label><select onchange="FRM.sub=this.value">
        <option value="">—</option>${c.subs.map(s=>`<option ${f.sub===s?'selected':''}>${s}</option>`).join('')}</select></div>`:''}`:''}
    <div class="field"><label>Miembro</label><select onchange="FRM.memberId=this.value">${opts(S.members,f.memberId,m=>m.name)}</select></div>

function planRows(a){
  if(!a.planStart) return [];
  const pct=(+a.planPct||0)/100, key=d=>{
    const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);
    return z.toISOString().slice(0,10);
  };
  const act=[...S.trades.filter(t=>t.accountId===a.id),...S.tFlows.filter(f=>f.accountId===a.id)]
    .map(x=>x.date).filter(Boolean).sort();
  const first=act.length&&act[0]<a.planStart?act[0]:a.planStart;
  const lastAct=act.length?act[act.length-1]:'';
  let last=lastAct>today()?lastAct:today();
  const ahead=+S.settings.planAhead||0;
  if(ahead){ const d=new Date(today()+'T00:00:00'); d.setDate(d.getDate()+ahead);
    const proy=key(d); if(proy>last) last=proy; }
  const end=new Date(last+'T00:00:00'), rows=[];
  let teo=+a.initial||0, real=+a.initial||0, guard=0;
  for(let d=new Date(first+'T00:00:00'); d<=end && guard<4200; d.setDate(d.getDate()+1), guard++){
    const k=key(d);
    const flow=S.tFlows.filter(f=>f.accountId===a.id&&f.date===k).reduce((s,f)=>s+(f.type==='retiro'?-f.amount:f.amount),0);
    const tr=S.trades.filter(t=>t.accountId===a.id&&t.date===k);
    const profit=tr.reduce((s,t)=>s+(+t.amount||0),0);
    const activo=k>=a.planStart;
    const ini=teo+flow, min=activo?ini*pct:0, cierre=ini+min;
    real=real+flow+profit;
    rows.push({k,flow,ini,min,cierre,profit,real,activo,fut:k>today(),
      n:tr.length,ef:tr.filter(t=>+t.amount>0).length,cump:min?profit/min:0});
    teo=cierre;
  }
  return rows.reverse();
}
function tStats(id){
  const tr=tTrades(id), a=S.tAccounts.find(x=>x.id===id)||{};
  const w=tr.filter(t=>+t.amount>0), l=tr.filter(t=>+t.amount<0), be=tr.filter(t=>+t.amount===0);
  const gp=w.reduce((s,t)=>s+t.amount,0), gl=Math.abs(l.reduce((s,t)=>s+t.amount,0));
  let eq=+a.initial||0, peak=eq, dd=0; const curve=[eq];
  tr.forEach(t=>{eq+=+t.amount||0;curve.push(eq);peak=Math.max(peak,eq);dd=Math.max(dd,peak-eq);});
  return {n:tr.length,w:w.length,l:l.length,be:be.length,gp,gl,net:gp-gl,
    pf:gl?gp/gl:(gp?Infinity:0), wr:(w.length+l.length)?w.length/(w.length+l.length)*100:0,
    dd, ddp:peak?dd/peak*100:0, curve,
    avgW:w.length?gp/w.length:0, avgL:l.length?gl/l.length:0};
}
const DIAS=[[7,'1 semana'],[30,'1 mes'],[90,'3 meses'],[180,'6 meses'],[365,'1 año'],
  [730,'2 años'],[1095,'3 años'],[1825,'5 años'],[2920,'8 años'],[3650,'10 años']];
function realRate(a){
  const tr=tTrades(a.id); if(tr.length<5) return {r:0,dias:0,factor:1,n:tr.length};
  const fechas=[...new Set(tr.map(t=>t.date))].sort();
  const dias=fechas.length;
  const span=Math.max(1,(new Date(fechas[dias-1])-new Date(fechas[0]))/86400000+1);
  const base=(+a.initial||0)+S.tFlows.filter(f=>f.accountId===a.id).reduce((z,f)=>z+(f.type==='retiro'?-f.amount:f.amount),0);
  const net=tr.reduce((z,t)=>z+(+t.amount||0),0);
  if(base<=0) return {r:0,dias,factor:1,n:tr.length};
  const ret=1+net/base;
  if(ret<=0) return {r:0,dias,factor:1,n:tr.length};
  return {r:Math.pow(ret,1/dias)-1, dias, factor:dias/span, n:tr.length};
}
function etaCal(cap,goal,r,factor){
  if(!(r>0)||!(cap>0)||goal<=cap) return 0;
  const opDias=Math.log(goal/cap)/Math.log(1+r);
  return opDias/(factor||1);
}
function planOpts(a){
  const meta=+S.settings.goalCapital||0, cap=tCapital(a.id);
  const rr=realRate(a);
  const e=etaCal(cap,meta,rr.r,rr.factor);
  let opts=[[0,'Sin proyección']];
  if(e>0&&e<40000){
    opts=opts.concat(DIAS.filter(([v])=>v<e));
    opts.push([Math.ceil(e),`Hasta la meta · ${(e/365).toFixed(1)} años`]);
  } else opts=opts.concat(DIAS);
  return opts;
}

  return {mode:t.mode||'pct',pct:+t.pct||0,brackets:t.brackets||[],cur:'USD'};

function taxYears(){

  const y=today().slice(0,4); if(!ys.includes(y)) ys.unshift(y); return ys;
}
function taxBase(y){
  let g=0, ret=0;
  S.tAccounts.filter(a=>a.mode==='real').forEach(a=>{
    const c=a.currency||'USD';
    S.trades.filter(t=>t.accountId===a.id&&t.date.slice(0,4)===y).forEach(t=>g+=toMXN(+t.amount||0,c));
    S.tFlows.filter(f=>f.accountId===a.id&&f.type==='retiro'&&f.date.slice(0,4)===y).forEach(f=>ret+=toMXN(+f.amount||0,c));
  });
  const cfg=taxCfg();
  const base=g/(S.settings.fx||1);
  return {ganancia:g, base, retiros:ret};
}
function taxCalc(base){
  const cfg=taxCfg();
  if(base<=0) return {imp:0, tasa:0};
  if(cfg.mode==='pct') return {imp:base*cfg.pct/100, tasa:cfg.pct};
  const br=[...cfg.brackets].sort((a,b)=>(+a.from)-(+b.from));
  let hit=null; br.forEach(b=>{ if(base>=+b.from) hit=b; });
  if(!hit) return {imp:0, tasa:0};
  const imp=(+hit.fixed||0)+(base-(+hit.from||0))*((+hit.rate||0)/100);
  return {imp, tasa:base?imp/base*100:0};
}

/* --- registro --- */
let regFilt={tf:'',res:''};
function iReg(a){
  let tr=tTrades(a.id).slice().reverse();
  if(regFilt.tf) tr=tr.filter(t=>t.tf===regFilt.tf);
  if(regFilt.res) tr=tr.filter(t=>t.res===regFilt.res);
  let cap=+a.initial||0; const capMap={};
  tTrades(a.id).forEach(t=>{cap+=+t.amount||0;capMap[t.id]=cap;});
  const P=prof(a);
  const th=['Fecha','Símbolo','TF','Operación',...P.fields.map(x=>x.l),'Entrada','SL','TP','Cierre','R/B','Resultado','$','Capital'];
  return `<div class="card">
    <div class="frow" style="margin-bottom:12px">
      <select onchange="regFilt.tf=this.value;render()"><option value="">TF</option>${TFS.map(x=>`<option ${regFilt.tf===x?'selected':''}>${x}</option>`).join('')}</select>
      <select onchange="regFilt.res=this.value;render()"><option value="">Resultado</option>${['Profit','Lose','Break Even'].map(x=>`<option ${regFilt.res===x?'selected':''}>${x}</option>`).join('')}</select>
    </div>
    <div style="display:flex;justify-content:space-between;margin-bottom:8px">
      <span class="lbl">${tr.length} trades</span>
      <button class="mini" onclick="editTrade()">+ Nuevo trade</button></div>
    ${tr.length?`<div style="overflow:auto"><table class="num" style="width:100%;border-collapse:collapse;font-size:11.5px;min-width:900px">
      <tr>${th.map(h=>`<th class="lbl" style="text-align:right;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap">${h}</th>`).join('')}</tr>
      ${tr.map(t=>`<tr onclick="editTrade('${t.id}')" style="border-bottom:1px solid var(--line);cursor:pointer">
        <td style="padding:9px;text-align:right;white-space:nowrap">${t.date.slice(5)}</td>
        <td style="padding:9px;text-align:right;color:var(--mute)">${t.symbol||''}</td>
        <td style="padding:9px;text-align:right;color:var(--mute)">${t.tf||''}</td>
        <td style="padding:9px;text-align:right;white-space:nowrap">${t.side||''}</td>
        ${P.fields.map(x=>`<td style="padding:9px;text-align:right;color:var(--mute)">${t[x.k]??''}</td>`).join('')}
        <td style="padding:9px;text-align:right;color:var(--mute)">${t.entry||''}</td>
        <td style="padding:9px;text-align:right;color:var(--mute)">${t.sl||''}</td>
        <td style="padding:9px;text-align:right;color:var(--mute)">${t.tp||''}</td>
        <td style="padding:9px;text-align:right;color:var(--mute);white-space:nowrap">${t.close||''}</td>
        <td style="padding:9px;text-align:right;color:var(--silver)">${rb(t)?rb(t).toFixed(2):'—'}</td>
        <td style="padding:9px;text-align:right;white-space:nowrap">${t.res||''}</td>
        <td style="padding:9px;text-align:right"${+t.amount<0?' class="neg"':''}>${(+t.amount>=0?'':'-')+'$'+mxn(Math.abs(+t.amount||0))}</td>
        <td style="padding:9px;text-align:right;color:var(--silver)">${mxn(capMap[t.id])}</td></tr>`).join('')}
      </table></div>`:'<div class="empty">Sin trades registrados</div>'}</div>`;
}

  return `<div class="card">

  const {ganancia,base,retiros}=taxBase(taxYear);

        <div class="row"><div class="grow t1">Falta por apartar</div><div class="num amt ${falta>0?'neg':''}">$${mxn(usd(falta))} USD</div></div>

          <div class="num amt">${r.type==='pago'?'-':'+'}$${mxn(r.amount)} <span style="color:var(--mute);font-size:9px">${r.currency}</span></div></div>`).join('')
          :'<div class="empty">Sin movimientos de reserva</div>'}</div>

    <div class="note" style="margin-top:12px">La provisión se calcula sobre la ganancia neta realizada del año en tus cuentas reales. Las demo se excluyen.</div></div>`;})()}`;
}

      `<button class="${f.type===k?'on':''}" onclick="FRM.type='${k}';drawTaxRes()">${l}</button>`).join('')}</div>

function saveTaxRes(){
  if(!(+FRM.amount>0)) return toast('Ingresa un monto.');
  if(!Array.isArray(S.taxRes)) S.taxRes=[];
  const rec={...FRM,amount:+FRM.amount};

  else {rec.id=uid();S.taxRes.push(rec);}
  save();closeModal();render();
  toast(rec.type==='pago'?'Pago registrado.':'Reserva apartada.');
}

/* --- estadísticas --- */
function iEst(a){
  const s=tStats(a.id);
  if(!s.n) return `<div class="card"><div class="empty">Sin datos suficientes</div></div>`;
  const box=(l,v,sub)=>`<div class="card"><div class="lbl">${l}</div><div class="num big">${v}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
  const W=300,H=110,c=s.curve,mn=Math.min(...c),mx=Math.max(...c),rg=(mx-mn)||1;
  const pts=c.map((v,i)=>`${(i/(c.length-1||1)*W).toFixed(1)},${(H-((v-mn)/rg)*(H-10)-5).toFixed(1)}`).join(' ');
  const grp=(title,fn)=>{
    const m={};tTrades(a.id).forEach(t=>{const k=fn(t)||'—';m[k]=m[k]||{n:0,v:0,w:0};m[k].n++;m[k].v+=+t.amount||0;if(+t.amount>0)m[k].w++;});
    const e=Object.entries(m).sort((x,y)=>y[1].n-x[1].n);
    return `<div class="card"><h3>${title}</h3>${e.map(([k,v])=>`<div class="row">
      <div class="grow"><div class="t1">${k}</div><div class="t2">${v.n} trades · ${(v.w/v.n*100).toFixed(0)}% efectivos</div></div>
      <div class="num amt"${v.v<0?' class="neg"':''}>${v.v<0?'-':''}$${mxn(Math.abs(v.v))}</div></div>`).join('')}</div>`;
  };
  return `<div class="grid g4">
      ${box('Trades',s.n,`${s.w} profit · ${s.l} lose · ${s.be} BE`)}
      ${box('Efectividad',s.wr.toFixed(1)+'%','excluye break even')}
      ${box('Profit factor',s.pf===Infinity?'∞':s.pf.toFixed(2),'ganancia ÷ pérdida')}
      ${box('Drawdown máx.','$'+mxn(s.dd),s.ddp.toFixed(1)+'% del pico')}
    </div>
    <div class="grid g3">
      <div class="card"><h3>Curva de capital</h3>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:170px">
          <polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="1.4"/>
        </svg>
        <div style="display:flex;justify-content:space-between;margin-top:6px">
          <span class="lbl">Mín $${mxn(mn)}</span><span class="lbl">Máx $${mxn(mx)}</span></div></div>
      <div class="card"><h3>Resumen</h3>
        <div class="row"><div class="grow t1">Resultado neto</div><div class="num amt"${s.net<0?' class="neg"':''}>${s.net<0?'-':''}$${mxn(Math.abs(s.net))}</div></div>
        <div class="row"><div class="grow t1">Ganancia bruta</div><div class="num amt">$${mxn(s.gp)}</div></div>
        <div class="row"><div class="grow t1">Pérdida bruta</div><div class="num amt neg">-$${mxn(s.gl)}</div></div>
        <div class="row"><div class="grow t1">Ganancia promedio</div><div class="num amt">$${mxn(s.avgW)}</div></div>
        <div class="row"><div class="grow t1">Pérdida promedio</div><div class="num amt">$${mxn(s.avgL)}</div></div>
        ${(()=>{const u=prof(a).fields.find(x=>['pips','ticks'].includes(x.k));
          return u?`<div class="row"><div class="grow t1">${u.l} totales</div><div class="num amt">${tTrades(a.id).reduce((z,t)=>z+(+t[u.k]||0),0).toFixed(1)}</div></div>`:'';})()}</div>
    </div>
    <div class="grid g3">${grp('Por temporalidad',t=>t.tf)}${grp('Por motivo de cierre',t=>t.close)}</div>
    <div class="grid g3">${grp('Por tipo de operación',t=>t.side)}${grp('Por sesión',t=>t.session)}</div>`;
}

/* ============================================================
   INVERSIÓN PASIVA · All Weather
   ============================================================ */
const AW=[
  {cls:'Acciones',target:30},
  {cls:'Bonos largo plazo',target:40},
  {cls:'Bonos mediano plazo',target:15},
  {cls:'Oro',target:7.5},
  {cls:'Materias primas',target:7.5}
];
let pasTab='cartera', distAmt=0;
const pUnits=id=>S.pMoves.filter(m=>m.assetId===id).reduce((s,m)=>s+(m.type==='venta'?-(+m.units||0):(m.type==='compra'?(+m.units||0):0)),0);
const pVal=a=>pUnits(a.id)*(+a.price||0);
const pValMXN=a=>toMXN(pVal(a),a.currency||'USD');
const pTotal=()=>S.pAssets.reduce((s,a)=>s+pValMXN(a),0);
function pInvested(){
  let inv=0;
  S.pMoves.forEach(m=>{const a=S.pAssets.find(x=>x.id===m.assetId);const c=a?.currency||'USD';
    if(m.type==='compra') inv+=toMXN(+m.amount||0,c);
    if(m.type==='venta') inv-=toMXN(+m.amount||0,c);});
  return inv;
}
const pDivs=()=>S.pMoves.filter(m=>m.type==='dividendo').reduce((s,m)=>{
  const a=S.pAssets.find(x=>x.id===m.assetId);return s+toMXN(+m.amount||0,a?.currency||'USD');},0);
function pByClass(){
  const tot=pTotal(), map={};
  AW.forEach(x=>map[x.cls]={target:x.target,val:0,assets:[]});
  S.pAssets.forEach(a=>{ if(!map[a.cls]) map[a.cls]={target:0,val:0,assets:[]};
    map[a.cls].val+=pValMXN(a); map[a.cls].assets.push(a); });
  Object.values(map).forEach(v=>{v.pct=tot?v.val/tot*100:0;v.dev=v.pct-v.target;v.ideal=tot*v.target/100;v.delta=v.ideal-v.val;});
  return map;
}

function vPas(){
  if(!S.pAssets.length) return `<div class="card" style="margin-top:14px">
    <div class="empty">Sin instrumentos en la cartera</div>
    <button class="btn" onclick="seedAW()">Cargar plantilla All Weather</button>
    <button class="btn ghost" style="margin-top:8px" onclick="editAsset()">Agregar instrumento manual</button>
    <div class="note" style="margin-top:14px">La plantilla crea las cinco clases con los pesos de Ray Dalio (30 / 40 / 15 / 7.5 / 7.5). Luego editas cada instrumento con tu ticker y precio.</div></div>`;
  const tot=pTotal(), inv=pInvested(), div=pDivs(), rend=tot-inv+div;
  const map=pByClass(), band=+S.settings.band||5;
  const fuera=Object.entries(map).filter(([k,v])=>Math.abs(v.dev)>band).length;
  const sh=['#D71921','#8E1015','#B9BDC1','#5C6167','#3A3A3A'];
  const bar=`<div style="display:flex;height:8px;border-radius:1px;overflow:hidden;margin-top:14px">
    ${Object.entries(map).map(([k,v],i)=>`<div style="width:${v.pct}%;background:${sh[i%sh.length]}"></div>`).join('')}</div>`;
  const head=`<div class="grid g4">
    <div class="card"><h3>Valor actual<span class="dot"></span></h3><div class="num big">$${mxn(usd(tot))}<small>USD</small></div></div>
    <div class="card"><h3>Aportado</h3><div class="num big">$${mxn(usd(inv))}<small>USD</small></div></div>
    <div class="card"><h3>Rendimiento</h3><div class="num big ${rend<0?'neg':''}">${rend<0?'-':'+'}$${mxn(Math.abs(rend))}</div>
      <div class="sub">${inv?((rend/inv)*100).toFixed(2):'0.00'}% · dividendos $${mxn(div)}</div></div>
    <div class="card"><h3>Desviación</h3><div class="num big ${fuera?'neg':''}">${fuera}</div>
      <div class="sub">clases fuera de banda ±${band}%</div></div></div>
  ${bar}
  <div class="seg" style="margin-top:14px">${[['cartera','Cartera'],['reb','Rebalanceo'],['mov','Movimientos'],['pre','Precios']]
    .map(([k,l])=>`<button class="${pasTab===k?'on':''}" onclick="pasTab='${k}';render()">${l}</button>`).join('')}</div>`;
  return head+({cartera:pCartera,reb:pReb,mov:pMov,pre:pPre})[pasTab](map,tot);
}

function pCartera(map,tot){
  const band=+S.settings.band||5;
  return `<div class="grid g2">${Object.entries(map).map(([k,v])=>`
    <div class="card"><h3>${k}<span class="mini">objetivo ${v.target}%</span></h3>
      <div class="num big">$${mxn(usd(v.val))}<small>USD</small></div>
      <div class="strip"><i style="width:${Math.min(100,v.pct)}%"></i></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px">
        <span class="num" style="font-size:12px">${v.pct.toFixed(1)}% real</span>
        <span class="num" style="font-size:12px;color:${Math.abs(v.dev)>band?'var(--red)':'var(--mute)'}">${v.dev>=0?'+':''}${v.dev.toFixed(1)} pts</span></div>
      <div style="margin-top:10px">${v.assets.map(a=>`<div class="row" onclick="editAsset('${a.id}')" style="cursor:pointer;padding:8px 0">
        <div class="grow"><div class="t1">${a.name}${a.ticker?' · '+a.ticker:''}</div>
        <div class="t2">${pUnits(a.id).toFixed(4)} u × $${mxn(a.price)} ${a.currency||'USD'}</div></div>
        <div class="num amt">$${mxn(pValMXN(a))}</div></div>`).join('')||'<div class="note">Sin instrumentos</div>'}</div>
    </div>`).join('')}</div>
    <button class="btn ghost" style="margin-top:12px" onclick="editAsset()">+ Nuevo instrumento</button>`;
}

function pReb(map,tot){
  const band=+S.settings.band||5;
  const rows=Object.entries(map);
  const dist=(()=>{
    if(!(distAmt>0)) return '';
    const nt=tot+distAmt;
    const need=rows.map(([k,v])=>({k,d:Math.max(0,nt*v.target/100-v.val)}));
    const sum=need.reduce((s,x)=>s+x.d,0);
    const out=need.map(x=>({k:x.k,amt:sum?distAmt*x.d/sum:0})).filter(x=>x.amt>0.01);
    return `<div style="margin-top:14px">${out.map(x=>`<div class="row"><div class="grow t1">${x.k}</div>
      <div class="num amt">$${mxn(x.amt/(S.settings.fx||1))}<span style="color:var(--mute);font-size:9px"> USD</span></div></div>`).join('')}
      <div class="note" style="margin-top:10px">Reparte la aportación solo entre las clases por debajo de su objetivo. Es el rebalanceo sin vender nada, que evita costos e impuestos.</div></div>`;
  })();
  return `<div class="card"><h3>Banda de tolerancia</h3>
    <div class="field" style="margin-bottom:0"><label>Desviación permitida (±%)</label>
      <input type="number" step="0.5" value="${band}" onchange="S.settings.band=+this.value;save();render()"></div>
    <div class="note" style="margin-top:12px">Mientras una clase no se aleje más de ${band} puntos de su objetivo, la dejas correr. Bandas estrechas te mantienen fiel a la estrategia pero te obligan a operar seguido; bandas anchas evitan costos e impuestos a cambio de permitir más desbalance.</div></div>

  <div class="card" style="margin-top:10px"><h3>Distancia al objetivo</h3>
    ${rows.map(([k,v])=>`<div class="row"><div class="tag" style="background:${Math.abs(v.dev)>band?'var(--red)':'var(--silver)'}"></div>
      <div class="grow"><div class="t1">${k}</div>
      <div class="t2">${v.pct.toFixed(1)}% real · ${v.target}% objetivo · ${v.dev>=0?'+':''}${v.dev.toFixed(1)} pts</div></div>
      <div class="num amt">${v.delta>=0?'comprar':'vender'} $${mxn(Math.abs(v.delta)/(S.settings.fx||1))}<span style="color:var(--mute);font-size:9px"> USD</span></div></div>`).join('')}
    <div class="note" style="margin-top:12px">La cartera All Weather se rebalancea típicamente una vez al año o cuando una clase se sale de banda.</div></div>
  <div class="card" style="margin-top:10px"><h3>Repartir una aportación</h3>
    <div class="field"><label>Monto a aportar (USD)</label>
      <input type="number" step="0.01" value="${distAmt?(distAmt/(S.settings.fx||1)).toFixed(2):''}"
        oninput="distAmt=+this.value*(S.settings.fx||1);render()"></div>
    ${dist||'<div class="note">Escribe cuánto vas a aportar y te digo cómo repartirlo para acercarte al objetivo sin vender.</div>'}</div>`;
}

    <div style="display:flex;justify-content:space-between;margin-bottom:8px">

/* ============ tipo de cambio en línea ============ */
async function fetchFX(manual){
  const urls=['https://api.frankfurter.app/latest?from=USD&to=MXN',
              'https://open.er-api.com/v6/latest/USD'];
  for(const u of urls){
    try{
      const r=await fetch(u);
      const j=await r.json();
      const v=j&&j.rates&&j.rates.MXN;
      if(v){ S.settings.fx=+(+v).toFixed(4); S.settings.fxDate=today(); save(); render();
        if(manual) toast('USD/MXN actualizado: '+S.settings.fx); return true; }
    }catch(e){}
  }
  if(manual) toast('Sin conexión al servicio. Captura el tipo de cambio manualmente.');
  return false;
}

function save(){
  try{ stampChanges(); }catch(e){ console.warn('stamp',e); }
  try{ const p=DB.save(S); if(p&&p.catch) p.catch(e=>console.warn('storage',e)); }catch(e){console.warn('storage',e);}
  try{ syncPush(); }catch(e){ console.warn('sync',e); }
}

/* ============ sincronización familiar ============ */
const COLS=['members','accounts','categories','tx','goals','tAccounts','trades','tFlows','pAssets','pMoves','taxRes'];
let SNAP={}, SYNC={on:false,estado:'desconectado',db:null,ref:null,unsub:null,timer:null,aplicando:false};

const limpio=r=>{const o={...r}; delete o.u; return JSON.stringify(o);};

/* marca con reloj los registros que cambiaron y deja lápida de los borrados */
function stampChanges(){
  const now=Date.now();
  if(!Array.isArray(S.tomb)) S.tomb=[];
  COLS.forEach(col=>{
    const arr=S[col]||[]; const prev=SNAP[col]||{}; const cur={};
    arr.forEach(r=>{
      if(!r||!r.id) return;
      cur[r.id]=limpio(r);
      if(prev[r.id]===undefined || prev[r.id]!==cur[r.id]) r.u=now;
      else if(!r.u) r.u=now;
    });
    Object.keys(prev).forEach(id=>{ if(cur[id]===undefined) S.tomb.push({col,id,u:now}); });
    SNAP[col]=cur;
  });
  const sj=JSON.stringify(S.settings);
  if(SNAP.__set!==undefined && SNAP.__set!==sj) S.settings.u=now;
  else if(!S.settings.u) S.settings.u=now;
  SNAP.__set=JSON.stringify(S.settings);
  // las lápidas viejas se descartan a los 90 días
  const corte=now-90*864e5;
  S.tomb=S.tomb.filter(t=>t.u>corte);
}
function resetSnap(){
  SNAP={};
  COLS.forEach(col=>{ const m={}; (S[col]||[]).forEach(r=>{ if(r&&r.id) m[r.id]=limpio(r); }); SNAP[col]=m; });
  SNAP.__set=JSON.stringify(S.settings);
}

/* fusiona el estado remoto con el local, registro por registro */
function mergeRemote(R){
  if(!R) return false;
  let cambio=false;
  const tomb=[...(S.tomb||[]),...(R.tomb||[])];
  const borrado=(col,id)=>tomb.filter(t=>t.col===col&&t.id===id).reduce((m,t)=>Math.max(m,t.u||0),0);
  COLS.forEach(col=>{
    const loc=S[col]||[], rem=R[col]||[];
    const map={}; loc.forEach(r=>{ if(r&&r.id) map[r.id]=r; });
    rem.forEach(r=>{
      if(!r||!r.id) return;
      const mio=map[r.id];
      if(!mio){ if((r.u||0)>borrado(col,r.id)){ loc.push(r); map[r.id]=r; cambio=true; } }
      else if((r.u||0)>(mio.u||0)){ Object.assign(mio,r); cambio=true; }
    });
    // aplicar lápidas remotas sobre lo local
    const antes=loc.length;
    S[col]=loc.filter(r=>!(r&&r.id&&borrado(col,r.id)>(r.u||0)));
    if(S[col].length!==antes) cambio=true;
  });
  if(R.settings && (R.settings.u||0)>(S.settings.u||0)){ S.settings={...S.settings,...R.settings}; cambio=true; }
  S.tomb=tomb.filter((t,i,a)=>a.findIndex(x=>x.col===t.col&&x.id===t.id&&x.u===t.u)===i);
  return cambio;
}

const syncCfg=()=>{ try{ return JSON.parse(localStorage.getItem('wealthos_sync')||'null'); }catch(e){ return null; } };
const syncCfgSet=c=>{ try{ localStorage.setItem('wealthos_sync',JSON.stringify(c)); }catch(e){} };

async function syncInit(silencioso){
  const c=syncCfg();
  if(!c||!c.apiKey||!c.projectId||!c.email||!c.pass||!c.familia){ SYNC.estado='sin configurar'; return; }
  try{
    SYNC.estado='conectando…'; if(!silencioso) render();
    const B='https://www.gstatic.com/firebasejs/10.12.5/';
    const [app,auth,fs]=await Promise.all([
      import(B+'firebase-app.js'), import(B+'firebase-auth.js'), import(B+'firebase-firestore.js')]);
    const a=app.initializeApp({apiKey:c.apiKey,authDomain:c.projectId+'.firebaseapp.com',projectId:c.projectId});
    const au=auth.getAuth(a);
    try{ await auth.signInWithEmailAndPassword(au,c.email,c.pass); }
    catch(e){ if(e.code==='auth/user-not-found'||e.code==='auth/invalid-credential')
        await auth.createUserWithEmailAndPassword(au,c.email,c.pass); else throw e; }
    SYNC.db=fs.getFirestore(a); SYNC.fs=fs;
    SYNC.ref=fs.doc(SYNC.db,'familias',c.familia);
    if(SYNC.unsub) SYNC.unsub();
    SYNC.unsub=fs.onSnapshot(SYNC.ref,snap=>{
      if(!snap.exists()) return;
      const d=snap.data();
      if(d.autor===SYNC.yo) return;
      let R=null; try{ R=JSON.parse(d.blob||'null'); }catch(e){ return; }
      if(mergeRemote(R)){ resetSnap(); DB.save(S); render(); toast('Actualizado desde la familia'); }
    },err=>{ SYNC.estado='error: '+err.code; render(); });
    SYNC.yo=au.currentUser.uid+'·'+Math.random().toString(36).slice(2,6);
    SYNC.on=true; SYNC.estado='conectado';
    await syncPush(true);
    if(!silencioso){ toast('Sincronización activa'); render(); }
  }catch(e){ SYNC.on=false; SYNC.estado='error: '+(e.code||e.message); if(!silencioso){ toast('No se pudo conectar'); render(); } }
}
async function syncPush(inmediato){
  if(!SYNC.on||!SYNC.ref) return;
  clearTimeout(SYNC.timer);
  const envia=async()=>{
    try{
      await SYNC.fs.setDoc(SYNC.ref,{blob:JSON.stringify(S),autor:SYNC.yo,ts:Date.now()});
      SYNC.estado='conectado'; const b=document.getElementById('syncDot'); if(b) b.textContent='conectado';
    }catch(e){ SYNC.estado='error al enviar'; }
  };
  if(inmediato) return envia();
  SYNC.timer=setTimeout(envia,1500);
}
function syncOff(){
  if(SYNC.unsub) SYNC.unsub();
  SYNC={on:false,estado:'desconectado',db:null,ref:null,unsub:null,timer:null};
  try{ localStorage.removeItem('wealthos_sync'); }catch(e){}
  toast('Sincronización desactivada'); render();
}
function syncGuardar(){
  const g=id=>(document.getElementById(id)||{}).value||'';
  const c={apiKey:g('sApi').trim(),projectId:g('sProj').trim(),email:g('sMail').trim(),
    pass:g('sPass'),familia:g('sFam').trim()||'casa'};
  if(!c.apiKey||!c.projectId||!c.email||!c.pass) return toast('Faltan datos de conexión.');
  syncCfgSet(c); syncInit();
}

/* ============ arranque ============ */
(async()=>{
  try{
    const d=await DB.load();
    if(d&&d.accounts){ S={...seed(),...d,settings:{...seed().settings,...(d.settings||{})}};
      ['tAccounts','trades','tFlows','pAssets','pMoves','taxRes','goals','tx','accounts','categories','members'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=seed()[k];}); }
  }catch(e){ console.warn('load',e); }
  if(!Array.isArray(S.tomb)) S.tomb=[];
  try{ resetSnap(); }catch(e){ console.warn('snap',e); }
  document.documentElement.dataset.theme=(S.settings&&S.settings.theme)||'dark';
  render();
  if(S.settings.fxAuto!==false && S.settings.fxDate!==today()) fetchFX(0);
  try{ if(syncCfg()) syncInit(1); }catch(e){ console.warn('sync',e); }
})();
